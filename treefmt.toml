# Run with `nix fmt`; the pre-commit hook checks staged files with it.
on-unmatched = "debug"
# Vendored upstream files and the generated hook config: reformatting them would churn every sync.
excludes = [
  ".claude-plugin/**",
  ".agents/plugins/**",
  ".agents/plugins/marketplace.json",
  ".claude-plugin/marketplace.json",
  "plugins/opt-in/hallmark/**",
  "plugins/flows/packs/**",
  "plugins/flows/agents/**",
  "plugins/shared/graphify/**",
  "plugins/opt-in/implementation/*-skills/library/**",
  "plugins/opt-in/implementation/*-skills/skills/**",
  "plugins/opt-in/implementation/*-skills/LICENSE",
  "plugins/opt-in/implementation/*-skills/UPSTREAM",
  "plugins/opt-in/implementation/postgres/skills/**",
  "plugins/flows/skills/review-code/LICENSE",
  "plugins/flows/skills/review-code/UPSTREAM",
  # Generated by the flow cockpit's export_bindings test.
  "tools/flow-cockpit/bindings/**",
  # The views' libraries, copied unchanged from their npm releases (THIRD_PARTY.md).
  "tools/flow-cockpit/app/shell/vendor/**",
  # Test fixtures are real documents and templates, read as written.
  "tools/flow-cockpit/core/tests/fixtures/**",
  "tools/ado-mcp/tests/fixtures/**",
  "tools/web-mcp/tests/fixtures/**",
  "plugins/shared/agent-review/skills/**",
  "plugins/shared/agent-review/LICENSE",
  "plugins/shared/agent-review/UPSTREAM",
  ".pre-commit-config.yaml",
  # npm writes it.
  "package-lock.json",
]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.prettier]
command = "prettier"
options = ["--write", "--no-config", "--print-width", "120", "--single-quote"]
includes = [
  "*.js",
  "*.mjs",
  "*.ts",
  "*.tsx",
  "*.json",
  "*.md",
  "*.yaml",
  "*.yml",
]

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]

[formatter.taplo]
command = "taplo"
options = ["fmt", "--no-auto-config"]
includes = ["*.toml"]
