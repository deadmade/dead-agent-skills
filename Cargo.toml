[workspace]
members = ["tools/web-mcp", "tools/ado-mcp"]
resolver = "3"

[workspace.package]
version = "0.6.35"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# Versions live here; members select their own features and target conditions.
# Keep Azure's exact pins coordinated: reqwest must match azure_core's version.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
azure_core = "=1.1.0"
azure_devops_rust_api = { version = "=0.39.1", default-features = false }
base64 = "0.23"
criterion = { version = "=0.8.2", default-features = false }
dom_query = "0.29"
dom_smoothie = "=0.19.0"
futures = { version = "0.3", default-features = false }
htmd = "=0.5.6"
image = { version = "0.25", default-features = false }
jiff = "0.2.38"
libc = "0.2"
model2vec-rs = "0.4.0"
pdf_oxide = "=0.3.78"
quick-xml = "0.42"
reqwest = { version = "=0.13.5", default-features = false }
rmcp = "=3.8.0"
rustls = { version = "0.23", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.11"
tantivy = { version = "=0.27.0", default-features = false }
tokio = "1"
url = "2"
windows-sys = "0.61"
zip = { version = "=9.3.0", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
