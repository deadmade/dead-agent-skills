version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  # The root package.json and its workspaces (tools/*), one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
  # The diagrams skill's checker: Mermaid and jsdom, installed into a cache folder at run time, never into the plugin.
  - package-ecosystem: npm
    directory: /plugins/flows/skills/diagrams
    schedule:
      interval: weekly
      day: monday
    groups:
      diagrams:
        patterns: ['*']
  # One workspace and lockfile. Azure's reqwest and azure_core must move together.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
    ignore:
      - dependency-name: reqwest
      - dependency-name: azure_core
  - package-ecosystem: uv
    directory: /plugins/opt-in/headroom-trim/server
    schedule:
      interval: weekly
      day: monday
    groups:
      uv:
        patterns: ['*']
