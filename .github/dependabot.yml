version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  # The root package.json and its workspaces (tools/*), one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: cargo
    directories: ['/tools/tui-review', '/tools/web-mcp', '/tools/flow-cockpit']
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
  # ado-mcp's reqwest must stay the one azure_core uses (AGENTS.md: `cargo tree -d -i reqwest` shows one), and
  # azure_devops_rust_api (archived upstream) pins azure_core, so neither moves on its own.
  - package-ecosystem: cargo
    directory: /tools/ado-mcp
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ['*']
    ignore:
      - dependency-name: reqwest
      - dependency-name: azure_core
  - package-ecosystem: uv
    directory: /plugins/opt-in/headroom-trim/server
    schedule:
      interval: weekly
      day: monday
    groups:
      uv:
        patterns: ['*']
