name: Sync

# Every vendored upstream, one job each (tools/upstream-sync/src/sources.ts lists them, tools/upstream-sync/src/cli.ts runs one): sync, check,
# open or update its sync/<name> PR, open an issue per new upstream skill, and keep a "Sync <name> failing" issue open
# while it fails. Runs only on schedule or manual dispatch.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'One source to sync (a name from tools/upstream-sync/src/sources.ts); empty for all'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.list.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Sources
        id: list
        env:
          SOURCE: ${{ inputs.source }}
        run: echo "sources=$(node tools/upstream-sync/src/cli.ts list --json ${SOURCE:+"$SOURCE"})" >> "$GITHUB_OUTPUT"

  sync:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.list.outputs.sources) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sync CLI runs TypeScript directly on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # The sync rebuilds the harnesses and the repo checks run the compiler, which needs its packages.
      - run: npm ci

      - name: Sync
        id: run
        run: node tools/upstream-sync/src/cli.ts apply --github-output ${{ matrix.source }}

      - name: Issues for new upstream skills
        if: steps.run.outcome == 'success'
        run: node tools/upstream-sync/src/cli.ts issues ${{ matrix.source }}

      # A PR opened with the workflow's token starts no other workflow, so test.yml never sees it: check here.
      - name: Claude Code, for plugin validate
        run: npm install -g @anthropic-ai/claude-code

      - name: Repo checks
        run: node scripts/test.mjs --strict repo

      - name: Skill scan
        if: steps.run.outputs.scan == 'true'
        run: npm run scan-skills

      - name: Open pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: ${{ steps.run.outputs.branch }}
          delete-branch: true
          commit-message: ${{ steps.run.outputs.commit-message }}
          title: ${{ steps.run.outputs.title }}
          body-path: ${{ steps.run.outputs.body-path }}
          add-paths: ${{ steps.run.outputs.paths }}

      - name: Report the failure
        if: failure()
        run: node tools/upstream-sync/src/cli.ts failed ${{ matrix.source }} "$RUN_URL"

      - name: Close a failure report
        if: success()
        run: node tools/upstream-sync/src/cli.ts passed ${{ matrix.source }} "$RUN_URL"
