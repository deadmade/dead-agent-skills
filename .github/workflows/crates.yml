name: crates

# Check affected packages together and independently; shared inputs select the whole workspace.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Formatting
        run: |
          packages=$(node -e 'console.log(JSON.parse(process.env.PACKAGES).map(p => "-p " + p).join(" "))')
          cargo fmt $packages -- --check

      - name: Clippy
        shell: pwsh
        run: |
          $packages = @($env:PACKAGES | ConvertFrom-Json)
          $selection = @($packages | ForEach-Object { '-p'; $_ })
          cargo clippy @selection --all-targets --locked -- -D warnings

      # The fake is needed by unit tests, which cannot use CARGO_BIN_EXE.
      - name: Rust tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @($env:PACKAGES | ConvertFrom-Json)
          $selection = @($packages | ForEach-Object { '-p'; $_ })
          if ($packages -contains 'web-mcp') { cargo build --locked -p web-mcp --bin fake-agent-browser }
          cargo test @selection --locked

      - name: Individual package tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($package in ($env:PACKAGES | ConvertFrom-Json)) {
            cargo test --locked -p $package
          }

  # Validate each independently installed Linux package.
  nix:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.binaries) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Nix package
        run: |
          nix build .#${{ matrix.package }} -L
          ./result/bin/${{ matrix.package }} --version

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Minimum supported Rust
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal
          rustup override set "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: msrv
      - name: Check selected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          packages=$(node -e 'console.log(JSON.parse(process.env.PACKAGES).map(p => "-p " + p).join(" "))')
          cargo check $packages --all-targets --locked
