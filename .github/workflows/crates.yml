name: crates

# Check affected packages together and independently; shared inputs select the whole workspace.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Formatting
        run: |
          packages=$(node -e 'console.log(JSON.parse(process.env.PACKAGES).map(p => "-p " + p).join(" "))')
          cargo fmt $packages -- --check

      - name: Clippy
        shell: pwsh
        run: |
          $packages = @($env:PACKAGES | ConvertFrom-Json)
          $selection = @($packages | ForEach-Object { '-p'; $_ })
          cargo clippy @selection --all-targets --locked -- -D warnings

      # The tests that drive a real browser, only in web-mcp, browser-core and http-runner: the pinned, checksum-checked
      # agent-browser, which the rust suite passes to cargo through WEB_MCP_AGENT_BROWSER.
      - name: agent-browser
        id: agent-browser
        if: contains(fromJSON(env.PACKAGES), 'web-mcp') || contains(fromJSON(env.PACKAGES), 'browser-core') || contains(fromJSON(env.PACKAGES), 'http-runner')
        run: |
          node scripts/agent-browser.mjs key
          bin=$(node scripts/agent-browser.mjs download "$RUNNER_TEMP")
          echo "WEB_MCP_AGENT_BROWSER=$bin" >> "$GITHUB_ENV"

      # Chrome for Testing, whichever version agent-browser installs (ADR 0018's one unpinned download).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        if: steps.agent-browser.outcome == 'success'
        with:
          path: ~/.agent-browser/browsers
          key: ${{ steps.agent-browser.outputs.key }}

      # On a miss, fill the cache.
      - name: Chrome for Testing
        if: steps.agent-browser.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        run: node scripts/agent-browser.mjs install "$WEB_MCP_AGENT_BROWSER"

      # On Linux the headed Chrome gets a virtual display.
      - name: Rust tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @($env:PACKAGES | ConvertFrom-Json) -join ','
          if ($IsLinux) {
            xvfb-run -a node scripts/test.mjs --strict rust --packages $packages --each-package
          } else {
            node scripts/test.mjs --strict rust --packages $packages --each-package
          }

  # Validate each independently installed Linux package.
  nix:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.binaries) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Nix package
        run: |
          nix build .#${{ matrix.package }} -L
          ./result/bin/${{ matrix.package }} --version

  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Minimum supported Rust
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal
          rustup override set "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: msrv
      - name: Check selected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          packages=$(node -e 'console.log(JSON.parse(process.env.PACKAGES).map(p => "-p " + p).join(" "))')
          cargo check $packages --all-targets --locked
