name: crates

# One workspace: validate combined features and each package independently.
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check_cargo_workspace*'
      - 'tools/tui-review/**'
      - 'plugins/shared/tui-review/**'
      - 'tools/web-mcp/**'
      - 'plugins/shared/web-mcp/**'
      - 'tools/ado-mcp/**'
      - 'plugins/opt-in/mcp/mcp-azure/**'
      - 'tools/flow-cockpit/**'
      - 'plugins/opt-in/flow-cockpit/**'
      - 'plugins/flows/**'
      - 'tools/harness-compiler/src/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/crates.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .

      - name: Native distributions
        run: |
          npm ci
          npm run build:harnesses

      - name: Workspace policy and formatting
        run: |
          python -m unittest discover -s scripts -p 'check_cargo_workspace_test.py'
          python scripts/check_cargo_workspace.py
          cargo fmt --all -- --check

      - name: Clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The fake is needed by unit tests, which cannot use CARGO_BIN_EXE.
      - name: Rust tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p web-mcp --bin fake-agent-browser
          cargo test --workspace --locked

      - name: Individual package tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($package in @('tui-review', 'web-mcp', 'ado-mcp', 'flow-cockpit-core', 'flow-cockpit')) {
            cargo test --locked -p $package
          }

      - name: Speed and memory budgets
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p tui-review --release --test perf -- --ignored --nocapture 2>&1 | Tee-Object "$env:RUNNER_TEMP/tui-review-budgets.txt"

      - name: Benchmarks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo bench --locked -p tui-review --bench format --bench review -- --sample-count 50 | Tee-Object "$env:RUNNER_TEMP/tui-review-bench.txt"

      - name: Mod fixture from tui-review gen
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo run --locked -p tui-review --release -- gen --out "$env:RUNNER_TEMP/tui-review-fixture" > $null
          node plugins/shared/tui-review/tests/make-fixture.mjs "$env:RUNNER_TEMP/tui-review-fixture"

      - name: Mod tests and speed budgets
        # The Claude package is generated from plugins/, which holds the sources and tests, so test it with them.
        run: |
          npm install -g @anthropic-ai/claude-code
          cp -r plugins/shared/tui-review/tests .claude-plugin/tui-review/tests
          cd .claude-plugin/tui-review
          claude plugin validate .
          claude plugin test .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tui-review-bench-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tui-review-bench.txt
            ${{ runner.temp }}/tui-review-budgets.txt

      - name: Views tests and type checks
        run: |
          node --test 'tools/flow-cockpit/app/shell/*.test.mjs' 'tools/flow-cockpit/extensions/tests/*.test.ts'
          npx tsc -p tools/flow-cockpit/app/shell
          npx tsc -p tools/flow-cockpit/extensions

  # Validate each independently installed Linux package, including cockpit's default extensions.
  nix:
    strategy:
      fail-fast: false
      matrix:
        package: [tui-review, web-mcp, ado-mcp, flow-cockpit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Nix package
        run: |
          nix build .#${{ matrix.package }} -L
          ./result/bin/${{ matrix.package }} --version
          if [ "${{ matrix.package }}" = flow-cockpit ]; then
            ./result/bin/flow-cockpit --print-paths
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Minimum supported Rust
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal
          rustup override set "$version"
      - name: WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .
          key: msrv
      - run: cargo check --workspace --all-targets --locked
