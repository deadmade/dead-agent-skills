# Run Node/plugin checks and skill scanning when their inputs change.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  test:
    needs: changes
    # Keep both required matrix check names even when no Node checks are needed.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Change detection succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.node == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.node == 'true'
        with:
          node-version-file: package.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.changes.outputs.node == 'true'
        with:
          enable-cache: true

      - name: Claude Code, for plugin validate and plugin test
        if: needs.changes.outputs.node == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.316

      - run: npm ci
        if: needs.changes.outputs.node == 'true'

      # check-repo, the first test, builds the native distributions (gitignored) that the later steps read.
      - name: Repo checks and tests
        if: needs.changes.outputs.node == 'true'
        run: npm test

      - name: Installer and upstream-sync typecheck
        if: needs.changes.outputs.node == 'true'
        run: |
          npm run typecheck

      # The installer as npx gets it: built, packed with its assets and without tests, and run through npx without a
      # terminal, which it refuses only after every module has loaded.
      - name: Installer package
        if: needs.changes.outputs.node == 'true'
        run: |
          npm pack
          tar -tzf dead-agent-skills-*.tgz > packed.txt
          grep -qx package/plugins/catalog.json packed.txt
          grep -qx package/.claude-plugin/dead-skills/.claude-plugin/plugin.json packed.txt
          grep -qx package/tools/installer/install.js packed.txt
          grep -qx package/tools/installer/assets/tools.json packed.txt
          grep -qx package/tools/installer/system/proc.js packed.txt
          grep -qx package/.agents/plugins/marketplace.json packed.txt
          grep -qx package/.agents/plugins/flows/.codex-plugin/plugin.json packed.txt
          if grep -q '\.test\.js$' packed.txt; then exit 1; fi
          set +e
          out=$(npx --yes ./dead-agent-skills-*.tgz < /dev/null 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] && grep -q 'Run this in a terminal' <<< "$out"

      # The Claude packages are generated from plugins/, which holds the sources and their tests, so each is tested with
      # its tests copied in.
      - name: dead-skills mod tests
        if: needs.changes.outputs.node == 'true'
        run: |
          cp plugins/default/hooks/*.test.* .claude-plugin/dead-skills/hooks/
          cd .claude-plugin/dead-skills
          claude plugin test .

      - name: md-pane mod tests
        if: needs.changes.outputs.node == 'true'
        run: |
          cp plugins/opt-in/md-pane/hooks/*.test.* .claude-plugin/md-pane/hooks/
          cd .claude-plugin/md-pane
          claude plugin test .

      - name: headroom-trim server tests
        if: needs.changes.outputs.node == 'true'
        working-directory: plugins/opt-in/headroom-trim/server
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/trim-venv
        run: uv run --locked python -m unittest discover -s tests

  # Cisco's skill-scanner over every skill under plugins/ and the composed flows skills in .claude-plugin/flows/skills/
  # (policy: .github/skill-scanner.yaml); fails on high or critical.
  skills:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # The composed flows skills exist only once built (the compiler imports smol-toml).
      - name: Native distributions
        run: |
          npm ci
          npm run build:harnesses

      - name: Skill scan
        run: npm run scan-skills
