# Run Node/plugin checks and skill scanning when their inputs change.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  test:
    needs: changes
    # Keep both required matrix check names even when no Node checks are needed.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The installer's end-to-end test adds a cold debug build (2 min locally) and a cold install (71 s locally).
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Change detection succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.node == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.node == 'true'
        with:
          node-version-file: package.json

      # The uv the installer pins, which the headroom-trim real test starts the server with.
      - name: uv pin
        id: uv
        if: needs.changes.outputs.node == 'true'
        run: echo "version=$(node -p "require('./tools/installer/assets/tools.json').tools.uv.version")" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: needs.changes.outputs.node == 'true'
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: Claude Code, for plugin validate and plugin test
        if: needs.changes.outputs.node == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.316

      # The installer's end-to-end test (tools/installer/install.real.test.ts) installs into Codex too.
      - name: Codex CLI
        if: needs.changes.outputs.node == 'true'
        run: npm install -g @openai/codex@0.172.0

      - run: npm ci
        if: needs.changes.outputs.node == 'true'

      # The end-to-end test serves this checkout's debug builds as the release; the workspace needs Rust 1.97.
      - name: Rust toolchain
        if: needs.changes.outputs.node == 'true'
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.node == 'true'
        with:
          workspaces: .

      # pwsh, so Windows links with MSVC's link.exe rather than Git Bash's /usr/bin/link.
      - name: Debug builds for the installer test
        if: needs.changes.outputs.node == 'true'
        shell: pwsh
        run: cargo build --locked -p web-mcp -p http-runner -p ado-mcp

      # The test seeds its temporary home's browsers from this folder, so only a new Chrome for Testing downloads.
      - name: agent-browser pin
        id: agent-browser
        if: needs.changes.outputs.node == 'true'
        run: echo "version=$(node -p "require('./tools/installer/assets/tools.json').tools['agent-browser'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        if: needs.changes.outputs.node == 'true'
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-browsers-${{ runner.os }}-${{ steps.agent-browser.outputs.version }}

      # On a miss, fill the cache with the pinned, checksum-checked agent-browser's own browser download.
      - name: Chrome for Testing
        if: needs.changes.outputs.node == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: |
          node --input-type=module -e "
            import { resolveTool } from './tools/installer/core/tools.ts';
            import { downloadBin } from './tools/installer/system/net.ts';
            const exe = process.platform === 'win32' ? '.exe' : '';
            await downloadBin('agent-browser', resolveTool('agent-browser', process.platform, process.arch, '0.0.0'), 'target/agent-browser' + exe);
            process.exit(0);
          "
          ./target/agent-browser install

      # The repo suite builds the native distributions (gitignored) that the later suites and steps read.
      - name: Repo checks and tests
        if: needs.changes.outputs.node == 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/trim-venv
        run: node scripts/test.mjs --strict repo node mods python real

      - name: Installer and upstream-sync typecheck
        if: needs.changes.outputs.node == 'true'
        run: |
          npm run typecheck

      # The installer as npx gets it: built, packed with its assets and without tests, and run through npx without a
      # terminal, which it refuses only after every module has loaded.
      - name: Installer package
        if: needs.changes.outputs.node == 'true'
        run: |
          npm pack
          tar -tzf dead-agent-skills-*.tgz > packed.txt
          grep -qx package/plugins/catalog.json packed.txt
          grep -qx package/.claude-plugin/dead-skills/.claude-plugin/plugin.json packed.txt
          grep -qx package/tools/installer/install.js packed.txt
          grep -qx package/tools/installer/assets/tools.json packed.txt
          grep -qx package/tools/installer/system/proc.js packed.txt
          grep -qx package/.agents/plugins/marketplace.json packed.txt
          grep -qx package/.agents/plugins/flows/.codex-plugin/plugin.json packed.txt
          if grep -q '\.test\.js$' packed.txt; then exit 1; fi
          set +e
          out=$(npx --yes ./dead-agent-skills-*.tgz < /dev/null 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] && grep -q 'Run this in a terminal' <<< "$out"

  # Cisco's skill-scanner over every skill under plugins/ and the composed flows skills in .claude-plugin/flows/skills/
  # (policy: .github/skill-scanner.yaml); fails on high or critical.
  skills:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # The composed flows skills exist only once built (the compiler imports smol-toml).
      - name: Native distributions
        run: |
          npm ci
          npm run build:harnesses

      - name: Skill scan
        run: npm run scan-skills
