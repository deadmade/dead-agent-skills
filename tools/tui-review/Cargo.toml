[package]
name = "tui-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Computes a branch's review diff and writes the cache the tui-review mod paints from."
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
gix = { workspace = true, features = ["revision", "blob-diff", "max-performance", "sha1"] }
imara-diff = { workspace = true }
rayon = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-nix = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-yaml = { workspace = true }
unicode-width = { workspace = true }
zerocopy = { workspace = true, features = ["derive"] }

# musl's malloc is slow under threads: colouring took 2.7x as long in the static Linux build. mimalloc serves both
# Rust and tree-sitter's C code there.
[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys = { workspace = true, features = ["extended"] }
mimalloc = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "format"
harness = false

[[bench]]
name = "review"
harness = false

[lints]
workspace = true
