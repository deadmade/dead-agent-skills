[package]
name = "ado-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio MCP server for the mcp-azure plugin: Azure DevOps Server pull request, work item, pipeline, search, wiki and repo file tools. Also builds timetrack, a TUI that times work items."
license.workspace = true
publish.workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
url = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
rustls = { workspace = true, features = ["std"] }
azure_devops_rust_api = { workspace = true, features = ["git", "build", "pipelines", "policy", "wit", "core", "ims", "search", "wiki", "test"] }
azure_core = { workspace = true }
# Already in the tree through azure_core; implementing its `Policy` needs the macro.
async-trait = { workspace = true }
# timetrack only.
ratatui = { workspace = true }
jiff = { workspace = true, features = ["serde"] }

[lints]
workspace = true
