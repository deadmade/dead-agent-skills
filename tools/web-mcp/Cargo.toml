[package]
name = "web-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stdio MCP server for the web-mcp plugin: search, fetch, browser, rows and lookup tools that archive everything in .web/."
license.workspace = true
publish.workspace = true

[dependencies]
browser-core = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
jiff = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "fs", "sync", "io-util", "time", "net", "process"] }
url = { workspace = true }
quick-xml = { workspace = true }
anyhow = { workspace = true }
dom_smoothie = { workspace = true }
htmd = { workspace = true }
dom_query = { workspace = true }
pdf_oxide = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2", "gzip", "brotli"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
futures = { workspace = true, features = ["std"] }
base64 = { workspace = true }
# Without zstd: no C toolchain needed to build.
tantivy = { workspace = true }
model2vec-rs = { workspace = true, optional = true }

[dev-dependencies]
browser-core = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "extract"
harness = false

# Test double for agent-browser; only the tests use it, the release ships `web-mcp` alone.
[[bin]]
name = "fake-agent-browser"
path = "tests/bin/fake_agent_browser.rs"

# H4 experiment only (examples/h4.rs); the server never links embeddings.
[features]
h4 = ["dep:model2vec-rs"]
# Lets a release build read WEB_MCP_TEST_PUBLIC_IP (the H5 concurrency driver); never shipped.
test-hooks = []

[[example]]
name = "h4"
required-features = ["h4"]

[lints]
workspace = true
